name: Ramp AI Index probe (one-off)

on:
  push:
    branches: [claude/vibrant-goodall-vw7rxz]
    paths: [probe/**, .github/workflows/ramp-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - run: python probe/ramp_probe.py
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f probe/out
          git diff --cached --quiet && exit 0
          git commit -m "Ramp probe output [skip ci]"
          git push
