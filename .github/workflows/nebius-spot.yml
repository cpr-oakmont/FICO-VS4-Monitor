name: Nebius spot price snapshot

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 13:17 UTC (~9am ET)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nebius-spot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install -r nebius_spot/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture page
        run: python nebius_spot/scrape.py

      - name: Parse to CSV
        if: always()
        run: python nebius_spot/parse.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/nebius_spot
          git diff --cached --quiet && exit 0
          git commit -m "Nebius spot snapshot $(date -u +%F)"
          git pull --rebase
          git push
