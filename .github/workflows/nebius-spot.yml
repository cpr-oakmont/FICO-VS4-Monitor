name: Nebius spot price snapshot

on:
  schedule:
    # Twice daily: GitHub can delay or skip scheduled runs by hours, and the
    # second run covers a missed first one. Duplicate captures de-dupe.
    - cron: "17 13 * * *"   # 13:17 UTC (~9am ET)
    - cron: "17 1 * * *"    # 01:17 UTC (~9pm ET)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of hourly history to request (falls back to shorter if the API rejects it)"
        default: "7"

permissions:
  contents: write

concurrency:
  group: nebius-spot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect spot prices
        run: python nebius_spot/collect.py --lookback-days "${{ inputs.lookback_days || '7' }}"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/nebius_spot
          git diff --cached --quiet && exit 0
          git commit -m "Nebius spot snapshot $(date -u +%F)"
          git pull --rebase
          git push
